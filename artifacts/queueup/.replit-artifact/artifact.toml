kind = "web"
previewPath = "/"
title = "QueueUp"
description = "A digital queue management app for service businesses. Owners create and manage a live queue, customers join remotely without accounts, and a public screen shows the current and upcoming tickets."
version = "1.0.0"
id = "artifacts/queueup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22042

[services.development]
run = "pnpm --filter @workspace/queueup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/queueup", "run", "build" ]
serve = "static"
publicDir = "artifacts/queueup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22042"
BASE_PATH = "/"
